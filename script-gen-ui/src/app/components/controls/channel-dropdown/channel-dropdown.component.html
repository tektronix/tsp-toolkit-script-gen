<div class="channel-dropdown">
  <label for="channel-dropdown">{{ label }}</label>
  <select
    id="channel-dropdown"
    [attr.aria-label]="automationID"
    [ngClass]="{ 'invalid-select': selected && !selected.isValid }"
    (change)="onSelectionChanged($event)"
  >
    <option
      *ngFor="let option of options; trackBy: trackOptionByValue"
      [value]="option.value"
      [selected]="option.value === selected?.value"
      [ngClass]="{ 'invalid-option': !option.isValid }"
    >
      {{ option.label }}
    </option>
  </select>
</div>
