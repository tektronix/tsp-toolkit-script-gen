[workspace]
members = ["kic-script-gen", "script-aggregator", "script-gen-manager", "script-templates"]
resolver = "2"

[workspace.package]
version = "0.1.7"
#TODO

[workspace.dependencies]
anyhow = "1.0.81"
handlebars = "6.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "1.0.58"
script-templates = {path = "script-templates"}
script-gen-manager = {path = "script-gen-manager"}
script-aggregator = {path = "script-aggregator"}
tsp-toolkit-kic-lib = { git = "https://github.com/tektronix/tsp-toolkit-kic-lib.git", tag = "v0.17.2-1" }

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(coverage)'] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
arithmetic_side_effects = "deny"

[workspace.lints.rustdoc]
all = "warn"
missing_doc_code_examples = "warn"
