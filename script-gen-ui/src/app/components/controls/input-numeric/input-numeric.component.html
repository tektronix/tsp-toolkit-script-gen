<div class="input-numeric">
  <label for="input">{{ label }}</label>
  <input
    [attr.aria-label]="disabled ? automationID + '-Disabled' : automationID"
    type="number"
    [value]="displayValue"
    (blur)="onBlur($event)"
    (keydown)="onKeyDown($event)"
    [disabled]="disabled"
  />
</div>
